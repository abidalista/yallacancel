name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Sync Pages secrets
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | npx wrangler pages secret put ANTHROPIC_API_KEY --project-name=yallacancel
          printf '%s' "${{ secrets.LLAMA_CLOUD_API_KEY }}" | npx wrangler pages secret put LLAMA_CLOUD_API_KEY --project-name=yallacancel
          printf '%s' "${{ secrets.WHOP_API_KEY }}" | npx wrangler pages secret put WHOP_API_KEY --project-name=yallacancel
          if [ -n "${{ secrets.FOUNDER_ACCESS_TOKEN }}" ]; then
            printf '%s' "${{ secrets.FOUNDER_ACCESS_TOKEN }}" | npx wrangler pages secret put FOUNDER_ACCESS_TOKEN --project-name=yallacancel
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=yallacancel --branch=main
