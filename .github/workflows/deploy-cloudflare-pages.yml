# Direct wrangler deploy is redundant: Cloudflare Pages git integration already
# builds and ships main (the live site updated while this workflow was failing).
# Auto-run on push is disabled so main stops going red. Do not re-enable until
# GitHub Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set
# again (repo Settings → Secrets and variables → Actions). Both have been empty
# since 2026-09-15 (run 34986571826); last time they were present was 2026-07-29.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_WHOP_PLAN_ID: ${{ secrets.NEXT_PUBLIC_WHOP_PLAN_ID }}
        run: npm ci && npm run build

      - name: Sync Pages secrets
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | npx wrangler pages secret put ANTHROPIC_API_KEY --project-name=yallacancel
          printf '%s' "${{ secrets.LLAMA_CLOUD_API_KEY }}" | npx wrangler pages secret put LLAMA_CLOUD_API_KEY --project-name=yallacancel
          printf '%s' "${{ secrets.WHOP_API_KEY }}" | npx wrangler pages secret put WHOP_API_KEY --project-name=yallacancel
          if [ -n "${{ secrets.FOUNDER_ACCESS_TOKEN }}" ]; then
            printf '%s' "${{ secrets.FOUNDER_ACCESS_TOKEN }}" | npx wrangler pages secret put FOUNDER_ACCESS_TOKEN --project-name=yallacancel
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=yallacancel --branch=main
